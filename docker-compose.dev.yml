name: redis-token-bucket-limiter-dev

# Shared settings for both app instances, so we don't repeat them
x-limiter-app: &limiter-app
  init: true
  build:
    context: .
    dockerfile: Dockerfile.dev
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - redis-token-bucket-limiter-net-dev

services:
  # Server A
  app-dev-a:
    <<: *limiter-app
    container_name: redis-token-bucket-limiter-app-dev-a
    environment:
      PORT: ${APP_A_PORT:-3001}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '${APP_A_PORT:-3001}:${APP_A_PORT:-3001}'

  # Server B
  app-dev-b:
    <<: *limiter-app
    container_name: redis-token-bucket-limiter-app-dev-b
    environment:
      PORT: ${APP_B_PORT:-3002}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - '${APP_B_PORT:-3002}:${APP_B_PORT:-3002}'

  redis:
    image: redis:7-alpine
    container_name: redis-token-bucket-limiter-dev
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_token_bucket_limiter_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - redis-token-bucket-limiter-net-dev

volumes:
  redis_token_bucket_limiter_dev_data:

networks:
  redis-token-bucket-limiter-net-dev: